<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>
<style>
*{
    margin:0;
    padding:0;
    font-family:sans-serif;
}
.box1{
  margin:50px auto;
  max-width:500px;
  background-color:#fff;
  padding:30px;
  box-shadow:0px 0px 10px 0px rgba(0,0,0,0.2);
}
h1{
    text-align:center;
    font-size:36px;
    margin-bottom:20px;
}

h2{
    text-align:center;
    color:blue;
    margin-bottom:20px;
}

form{    
    display:flex;
    flex-direction:column;
}

label{
    font-size:18px;
    margin-bottom:8px;
}

input{
  padding:10px;
  margin-bottom:20px;
  border-radius:5px;
  font-size:16px;
}

.B{
  padding:10px;
  border:none;
  border-radius:5px;
  color:#fff;
  font-size:18px;
  background-color:blue;
  cursor:pointer;
  margin-bottom:10px;
}

.B:hover{
    background-color:#007bff;
}
</style>
</head>
<body>

<div class="box1">
  <h2>Welcome to BhojBox</h2>
  <h1>Sign up Page</h1>
  <form id="signupForm">
    <label>UserName:</label>
    <input type="text" id="username" placeholder="Enter your name" required>

    <label>Email:</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label>Phone:</label>
    <input type="text" id="phone" placeholder="Enter your phone number" required>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter your password" required>

    <button type="submit" class="B">Sign up</button>
    <button type="button" class="B" id="goLoginBtn">Already have an account? Log In</button>
  </form>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value.trim();

  
  const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}$/;

  if (!passwordRegex.test(password)) {
    alert("Password must be at least 6 characters and contain at least 1 number and 1 special character (!@#$%^&*)");
    return;
  }

  try {
    const res = await fetch("http://localhost:5000/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, email, phone, password })
    });

    const data = await res.json();

    if (data.success) {
      alert("Signup successful!");
      window.location.href = "login.html";
    } else {
      alert(data.message);
    }
  } catch (err) {
    console.error(err);
    alert("Server error! is not running");
  }
});

document.getElementById("goLoginBtn").addEventListener("click", function(){
  window.location.href = "login.html";
});
</script>

</body>
</html>
