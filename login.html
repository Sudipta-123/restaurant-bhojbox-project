<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
*{
    margin:0;
    padding:0;
    font-family:sans-serif;
}

.box1{
  margin:50px auto;
  max-width:500px;
  background-color:#fff;
  padding:30px;
  box-shadow:0px 0px 10px 0px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    font-size:36px;
    margin-bottom:20px;
}

h2{
    text-align:center;
    color:blue;
    margin-bottom:20px;
}

form{
    display:flex;
    flex-direction:column;
}

label{
    font-size:18px;
    margin-bottom:8px;
}

input[type="text"], input[type="password"]{
  padding:10px;
  margin-bottom:20px;
  border-radius:5px;
  font-size:16px;
}

.B{
  padding:10px;
  border:none;
  border-radius:5px;
  color:#fff;
  font-size:18px;
  background-color:blue;
  cursor:pointer;
  margin-bottom:10px;
}

.B:hover{
    background-color:#007bff;
}
</style>
</head>
<body>

<div class="box1">
  <h2>Welcome to BhojBox</h2>
  <h1>Login Page</h1>
  <form id="loginForm">
    <label>UserName:</label>
    <input type="text" id="username" placeholder="Enter your name" required>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter your password" required>

    <button type="submit" class="B">Login</button>
    <button type="button" class="B" id="goSignupBtn">Don't have an account? Sign up</button>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  try {
    const res = await fetch("http://localhost:5000/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      alert("Login successful!");
      window.location.href = "index.html";
    } else {
      alert(data.message);
    }
  } catch (err) {
    console.error(err);
    alert("Server error! Backend not running ");
  }
});

document.getElementById("goSignupBtn").addEventListener("click", function(){
  window.location.href = "signup.html";
});
</script>

</body>
</html>
